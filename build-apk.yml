name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-watch-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml was not found. Put this workflow in a Flutter project repository."
            exit 1
          fi

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          else
            echo "Android platform directory already exists; keeping existing project configuration."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-watch-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
